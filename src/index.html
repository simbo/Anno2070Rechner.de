<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>route-head</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    {% if APP_IS_PROD %}
    <script defer src="https://trk.srvkist.net/trk.js" data-website-id="4c2e9006-f449-4c9f-aec7-897bcceb1168"></script>
    {% endif %}
  </head>
  <body>
    <div id="app">
      <noscript>Bitte aktiviere JavaScript. / Please enable JavaScript.</noscript>
    </div>
    <!-- Browsers without Proxy cannot run the app, see docs/rebuild-plan.md#browser-support. -->
    <script>
      if (typeof Proxy === 'undefined') {
        document.getElementById('app').innerHTML = /\/en$/.test(location.pathname)
          ? 'This browser is too old for this site. Please use a newer one.'
          : 'Dieser Browser ist zu alt für diese Seite. Bitte verwende einen neueren.';
      }
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
